      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pC" x1="40" y1="12" x2="40" y2="40" gradientUnits="userSpaceOnUse">
