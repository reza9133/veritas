  <text x="228" y="238" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="56" letter-spacing="3" fill="url(#ogWord)">VERITAS</text>

  <text x="150" y="330" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="42" fill="#f4f3fb">Truth, settled by consensus.</text>
  <text x="150" y="378" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#b9b8cc">A prediction market with no admins and no human oracle —</text>
  <text x="150" y="408" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#b9b8cc">every outcome is adjudicated by GenLayer validator consensus.</text>

  <g transform="translate(150,455)">
