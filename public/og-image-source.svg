    <path d="M90,120 C60,104 50,68 90,40 C130,68 120,104 90,120 Z" fill="url(#ogV)" fill-opacity="0.92"/>
    <path d="M90,120 C60,104 50,68 90,40 C130,68 120,104 90,120 Z" fill="url(#ogC)" fill-opacity="0.92" transform="rotate(120 90 120)"/>
