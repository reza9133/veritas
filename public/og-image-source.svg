      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="0.88" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="0.5" cy="1.1" r="0.6">
      <stop offset="0" stop-color="#f2b84b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f2b84b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogV" x1="150" y1="150" x2="150" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ogC" x1="150" y1="150" x2="150" y2="270" gradientUnits="userSpaceOnUse">
