    <circle cx="220" cy="560" r="1.6" fill="#67e8f9"/>
    <circle cx="980" cy="120" r="1.6" fill="#fde68a"/>
    <circle cx="1080" cy="480" r="1.6" fill="#a78bfa"/>
    <circle cx="900" cy="540" r="1.6" fill="#67e8f9"/>
    <circle cx="60" cy="200" r="1.6" fill="#fde68a"/>
    <circle cx="1140" cy="260" r="1.6" fill="#a78bfa"/>
  </g>

